name: build-windows-php56

# PHP 5.6 is built with VC11 (VS2012), not the MSVC in windows-2022.
# The hosted runner performs preflight only. Binary builds require a properly
# provisioned self-hosted Windows x64 runner with VS2012 + legacy PHP SDK.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preflight:
    runs-on: windows-2022
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Validate source and patch presence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'PHP-5.6-CVE-2026-109618-109619') {
            throw 'Choose the PHP-5.6-CVE-2026-109618-109619 branch when running this workflow.'
          }
          if (-not (Test-Path 'Zend/zend_alloc.c')) {
            throw 'PHP 5.6 full source tree is missing. Upload the overlay onto the fork branch of php/php-src, not an empty repository.'
          }
          $patch = 'security-backports/php-5.6.40-CVE-2026-109618-109619.patch'
          if (-not (Test-Path $patch)) { throw "Missing patch: $patch" }
          if (-not (Select-String -Quiet -Path main/php_version.h -SimpleMatch '5.6.40-sec1')) {
            throw 'Backport is not applied to the fork source yet. Run apply-security-patch first.'
          }
          Write-Host 'Windows source preflight passed. This step does not compile PHP.'

  windows-vc11-build:
    needs: windows-preflight
    if: ${{ vars.ENABLE_PHP56_WINDOWS_VC11 == 'true' }}
    runs-on: [self-hosted, Windows, X64, php56-vc11]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        ts: [nts, ts]
    env:
      VC11_VCVARSALL: ${{ vars.VC11_VCVARSALL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled legacy VC11/PHP SDK environment
        shell: cmd
        run: |
          if not exist "%VC11_VCVARSALL%" (echo VC11_VCVARSALL is not configured & exit /b 1)
          if not exist main\php_version.h exit /b 1

      - name: Build PHP 5.6 with VC11 (${{ matrix.arch }}, ${{ matrix.ts }})
        shell: cmd
        run: |
          call "%VC11_VCVARSALL%" ${{ matrix.arch == 'x64' && 'amd64' || 'x86' }} || exit /b 1
          where nmake || exit /b 1
          where perl || exit /b 1
          call buildconf.bat || exit /b 1
          set ZTS_OPT=
          if "${{ matrix.ts }}"=="ts" set ZTS_OPT=--with-zts
          cscript //nologo configure.js --disable-all --enable-cli --enable-cgi --enable-session %ZTS_OPT% || exit /b 1
          nmake || exit /b 1

      - name: Collect executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'ci-win-binaries' | Out-Null
          $files = Get-ChildItem -Path . -Recurse -File -Include php.exe,php-cgi.exe |
            Where-Object { $_.DirectoryName -match 'Release' }
          if (-not $files) { throw 'No PHP binaries produced by VC11 build' }
          foreach ($file in $files) {
            Copy-Item -Path $file.FullName -Destination ('ci-win-binaries/' + $file.Name)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: php-5.6.40-sec1-${{ matrix.ts }}-Win32-${{ matrix.arch }}
          if-no-files-found: error
          path: ci-win-binaries/
