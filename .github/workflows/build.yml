name: build-linux-php56-from-fork

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: PHP-5.6-CVE-2026-109618-109619
    steps:
      - name: Checkout the fork branch source (no release archive download)
        uses: actions/checkout@v4
        with:
          ref: PHP-5.6-CVE-2026-109618-109619
          persist-credentials: false

      - name: Verify patched Git source before compiling
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#define PHP_VERSION "5.6.40-sec1"' main/php_version.h
          grep -Fq 'zend_mm_safe_error_ex' Zend/zend_alloc.c
          test -f configure.in
          test -f buildconf
          python3 ci/prepare-git-patch.py \
            --source security-backports/php-5.6.40-CVE-2026-109618-109619.patch \
            --output "$RUNNER_TEMP/php56-git.patch"
          git apply --reverse --check "$RUNNER_TEMP/php56-git.patch"
          echo '[OK] Complete Git patch present on checkout'

      - name: Generate configure and build on a legacy-toolchain-compatible environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # IMPORTANT: -i keeps STDIN open so bash -se can read the heredoc below.
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ubuntu:20.04 bash -se <<'IN_CONTAINER'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          trap 'chown -R "${HOST_UID}:${HOST_GID}" /work/artifacts 2>/dev/null || true' EXIT
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential bison re2c \
            pkg-config perl ca-certificates
          autoconf --version | sed -n '1p'
          ./buildconf --force
          test -x ./configure
          ./configure --prefix=/opt/php56-sec1 --disable-all \
             --enable-cli --enable-cgi --enable-fpm --enable-session \
             --enable-debug --without-pear
          make -j2
          ./sapi/cli/php -v | tee artifacts/version.txt
          grep -Fq 'PHP 5.6.40-sec1' artifacts/version.txt
          ./sapi/cli/php -i | grep -F max_multipart_body_parts | tee artifacts/multipart-ini.txt
          mkdir -p artifacts/php56-git-ubuntu2004/{bin,sbin}
          cp sapi/cli/php artifacts/php56-git-ubuntu2004/bin/
          cp sapi/cgi/php-cgi artifacts/php56-git-ubuntu2004/bin/
          cp sapi/fpm/php-fpm artifacts/php56-git-ubuntu2004/sbin/
          tar -C artifacts -czf artifacts/php56-git-ubuntu2004-unofficial.tar.gz php56-git-ubuntu2004
          sha256sum artifacts/php56-git-ubuntu2004-unofficial.tar.gz > artifacts/binaries.sha256
          IN_CONTAINER

          # Fail IN THE BUILD STEP if Docker did not run the heredoc or produced no binaries.
          for output in \
            artifacts/php56-git-ubuntu2004-unofficial.tar.gz \
            artifacts/binaries.sha256 \
            artifacts/version.txt \
            artifacts/multipart-ini.txt; do
            if [[ ! -s "$output" ]]; then
              echo "::error::Build output missing/empty: $output; inspect docker build step and Docker stdin handling."
              exit 1
            fi
          done
          # Verify the whole tar archive before searching for individual paths.
          # DO NOT pipe tar to grep -q under pipefail: grep exits early and can
          # make tar report "stdout: write error" even for a healthy archive.
          archive_list="$RUNNER_TEMP/php56-git-ubuntu2004-archive-list.txt"
          tar -tzf artifacts/php56-git-ubuntu2004-unofficial.tar.gz > "$archive_list"
          for expected_entry in \
            php56-git-ubuntu2004/bin/php \
            php56-git-ubuntu2004/bin/php-cgi \
            php56-git-ubuntu2004/sbin/php-fpm; do
            if ! grep -Fxq -- "$expected_entry" "$archive_list"; then
              echo "::error::Missing binary in tar archive: $expected_entry"
              exit 1
            fi
          done
          sha256sum -c artifacts/binaries.sha256
          echo '[OK] Actual PHP binaries were built and packaged.'

      - name: Upload built binaries (build passing does not prove CVEs fixed)
        uses: actions/upload-artifact@v4
        with:
          name: php56-git-linux-unofficial-binaries
          path: |
            artifacts/php56-git-ubuntu2004-unofficial.tar.gz
            artifacts/binaries.sha256
            artifacts/version.txt
            artifacts/multipart-ini.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run limited regression tests, capture actual failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # The build ran in an Ubuntu 20.04 container with build dependencies.
          # Recreate the runtime environment and CHECK the executable before PHPT.
          # -i is mandatory: the inner bash reads commands from the heredoc.
          if ! docker run --rm -i \
              -v "$GITHUB_WORKSPACE:/work" -w /work \
              -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
              ubuntu:20.04 bash -se <<'IN_CONTAINER'
          set -euo pipefail
          trap 'chown -R "${HOST_UID}:${HOST_GID}" /work/artifacts 2>/dev/null || true' EXIT
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends libcrypt1 ca-certificates
          echo '=== PHPT runtime dependency diagnostics ==='
          test -x sapi/cli/php
          test -f run-tests.php
          ldd sapi/cli/php | tee artifacts/php-runtime-ldd.txt
          if grep -F 'not found' artifacts/php-runtime-ldd.txt; then
            echo '[ERROR] A runtime shared library is missing from the test container.' >&2
            exit 1
          fi
          sapi/cli/php -v
          sapi/cli/php -r 'echo "PHP-RUNTIME-OK\n";'
          export NO_INTERACTION=1 SKIP_SLOW_TESTS=1 SKIP_ONLINE_TESTS=1
          export TEST_PHP_EXECUTABLE=/work/sapi/cli/php
          export TEST_PHP_CGI_EXECUTABLE=/work/sapi/cgi/php-cgi
          # The test result can be nonzero because of genuine test failures.
          set +e
          ./sapi/cli/php run-tests.php Zend/tests ext/session/tests tests/basic > artifacts/tests.log 2>&1
          test_exit=$?
          set -e
          printf '%s\n' "$test_exit" > artifacts/test-exit-code.txt
          echo "[PHPT] runner exit code: $test_exit"
          echo '=== PHPT log first 35 lines ==='
          sed -n '1,35p' artifacts/tests.log
          echo '=== PHPT log last 100 lines ==='
          tail -n 100 artifacts/tests.log
          IN_CONTAINER
          then
            echo '::error::Docker PHPT runtime/preflight failed. Check ldd above.'
            [[ ! -f artifacts/tests.log ]] || tail -n 100 artifacts/tests.log
            exit 1
          fi

          # Parse test evidence on the GitHub runner instead of installing Python
          # in a second container; this does NOT reinterpret a crash as success.
          python3 - <<'PYTEST'
          from pathlib import Path
          import re

          out = Path('artifacts')
          p = out / 'tests.log'
          log = p.read_text(errors='replace') if p.exists() else ''
          # PHP 5.6 run-tests.php does NOT print "TEST RESULT SUMMARY".
          # A complete run ends with "Number of tests :" and category counts.
          def count(label):
              match = re.search(r'^' + re.escape(label) + r'\s*:\s*(\d+)\b', log, re.M)
              if not match:
                  raise SystemExit('::error::Missing PHPT counter: ' + label)
              return int(match.group(1))

          total = count('Number of tests')
          passed = count('Tests passed')
          skipped = count('Tests skipped')
          failed = count('Tests failed')
          xfailed = count('Expected fail')
          warned = count('Tests warned')
          if total == 0:
              raise SystemExit('::error::PHPT reported zero tests')
          if passed + skipped + failed + xfailed + warned != total:
              raise SystemExit('::error::Inconsistent PHPT counters: ' + str(
                  dict(total=total, passed=passed, skipped=skipped, failed=failed,
                       xfailed=xfailed, warned=warned)))

          # Anchor section titles: EXPECTED FAILED TEST SUMMARY is XFAIL,
          # not the list of actual failures.
          match = re.search(r'(?ms)^FAILED TEST SUMMARY\s*\n[-]+\n(.*?)(?=^={10,}|\Z)', log)
          section = match.group(1) if match else ''
          actual = sorted(set(re.findall(r'\[((?:Zend|ext|tests)/[^]\r\n]+\.phpt)\]', section)))
          if len(actual) != failed:
              raise SystemExit('::error::PHPT failed count (%d) does not match parsed failures (%d)' %
                               (failed, len(actual)))

          expected_path = Path('tests/expected-failures.txt')
          if not expected_path.exists():
              raise SystemExit('::error::Missing expected-failures file: ' + str(expected_path))
          expected = {x.strip().strip('[]') for x in expected_path.read_text().splitlines()
                      if x.strip() and not x.lstrip().startswith('#')}
          extra = sorted(set(actual) - expected)
          now_passing = sorted(expected - set(actual))
          (out / 'actual-failures.txt').write_text('\n'.join(actual) + ('\n' if actual else ''))
          (out / 'unexpected-failures.txt').write_text('\n'.join(extra) + ('\n' if extra else ''))
          (out / 'expected-now-passing.txt').write_text('\n'.join(now_passing) + ('\n' if now_passing else ''))
          exit_code_path = out / 'test-exit-code.txt'
          test_exit = int(exit_code_path.read_text().strip()) if exit_code_path.exists() else -1
          print('PHPT results: total=%d passed=%d skipped=%d failed=%d xfail=%d warned=%d exit=%d' %
                (total, passed, skipped, failed, xfailed, warned, test_exit))
          print('Known actual failures:', actual)
          print('New/unexpected failures:', extra)
          print('Previously known but now passing:', now_passing)
          for heading in ('BORKED TEST SUMMARY', 'LEAKED TEST SUMMARY'):
              if re.search(r'^' + re.escape(heading) + r'$', log, re.M):
                  raise SystemExit('::error::' + heading + ' present; inspect tests.log')
          if warned:
              raise SystemExit('::error::PHPT reported warning results; review tests.log')
          if extra:
              raise SystemExit('::error::Unexpected PHP test failures; inspect saved diffs')
          if test_exit != 0 and not actual:
              raise SystemExit('::error::PHPT process exited nonzero without documented failed tests')
          if failed:
              print('::warning::%d allowlisted PHPT failures remain, all in session upload/RFC1867 tests. '
                    'These are real failures (not XFAIL); do not treat this as CVE remediation verification.' % failed)
          print('PHPT completed and all *actual* failures are currently allowlisted.')

          import os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as summary:
                  summary.write('\n### PHP 5.6.40-sec1 PHPT limited regression\n\n')
                  summary.write('| Total | PASS | SKIP | FAIL (allowlisted) | XFAIL | WARN |\n')
                  summary.write('|---:|---:|---:|---:|---:|---:|\n')
                  summary.write('| %d | %d | %d | %d | %d | %d |\n\n' %
                                (total, passed, skipped, failed, xfailed, warned))
                  summary.write('**Warning:** FAIL entries are actual failures in session/RFC1867 upload tests, '
                                'not the separate XFAIL entries. This does not prove the CVEs are fixed.\n')
          PYTEST

      - name: Collect PHPT .diff, .out and .exp evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PYDIFF'
          from pathlib import Path
          import shutil
          source_root = Path.cwd()
          destination = Path('artifacts/phpt-failure-details')
          copied = 0
          for area in ('Zend/tests', 'ext/session/tests', 'tests/basic'):
              for diff in Path(area).rglob('*.diff'):
                  base = diff.with_suffix('')
                  for ext in ('.diff', '.out', '.exp', '.log'):
                      source = base.with_suffix(ext)
                      if not source.is_file():
                          continue
                      target = destination / source
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                      copied += 1
          print('Copied %d PHPT debug files to %s' % (copied, destination))
          PYDIFF

      - name: Upload test logs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php56-git-linux-test-evidence
          path: |
            artifacts/tests.log
            artifacts/test-exit-code.txt
            artifacts/php-runtime-ldd.txt
            artifacts/actual-failures.txt
            artifacts/unexpected-failures.txt
            artifacts/expected-now-passing.txt
            artifacts/phpt-failure-details/**
          if-no-files-found: ignore
