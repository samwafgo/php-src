name: build-linux-php56

on:
  push:
    branches:
      - PHP-5.6-CVE-2026-109618-109619
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php56-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: PHP-5.6-CVE-2026-109618-109619
  PHP_TARBALL: php-5.6.40.tar.xz
  PHP_SHA256: 1369a51eee3995d7fbd1c5342e5cc917760e276d561595b6052b21ace2656d1c
  PATCH_FILE: security-backports/php-5.6.40-CVE-2026-109618-109619.patch

jobs:
  patch-preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify target branch and patch against official PHP 5.6.40
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}" || {
            echo '::error::Choose PHP-5.6-CVE-2026-109618-109619 in the Actions branch dropdown.'
            exit 1
          }
          test -s "$PATCH_FILE"
          curl --fail --location --retry 3 --retry-delay 3 \
            --output "$PHP_TARBALL" "https://museum.php.net/php5/$PHP_TARBALL"
          echo "$PHP_SHA256  $PHP_TARBALL" | sha256sum -c -
          tar -xJf "$PHP_TARBALL"
          cd php-5.6.40
          patch -p1 --batch --forward --dry-run < "../$PATCH_FILE"
          patch -p1 --batch --forward < "../$PATCH_FILE"
          grep -Fq 'PHP_EXTRA_VERSION "-sec1"' main/php_version.h
          echo 'Patch applies cleanly to verified PHP 5.6.40 source.'

  linux:
    needs: patch-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu2204, image: 'ubuntu:22.04' }
          - { name: ubuntu2404, image: 'ubuntu:24.04' }
          - { name: debian12,   image: 'debian:12' }
          - { name: almalinux9, image: 'almalinux:9' }
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned source and apply repository patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            --output "$PHP_TARBALL" "https://museum.php.net/php5/$PHP_TARBALL"
          echo "$PHP_SHA256  $PHP_TARBALL" | sha256sum -c -
          tar -xJf "$PHP_TARBALL"
          cd php-5.6.40
          patch -p1 --batch --forward --dry-run < "../$PATCH_FILE"
          patch -p1 --batch --forward < "../$PATCH_FILE"

      - name: Build and test in ${{ matrix.name }} container
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env DISTRO \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            "$IMAGE" bash -se <<'IN_CONTAINER'
          set -euo pipefail
          trap 'chown -R "${HOST_UID}:${HOST_GID}" /work/php-5.6.40 /work/dist 2>/dev/null || true' EXIT
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              gcc g++ make libc6-dev ca-certificates tar xz-utils
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y gcc gcc-c++ make glibc-devel tar xz
          else
            echo 'Unsupported build container' >&2; exit 1
          fi
          cd /work/php-5.6.40
          ./configure --disable-all --enable-cli --enable-cgi \
                      --enable-fpm --enable-session --enable-debug
          make -j2
          sapi/cli/php -v | grep -F 'PHP 5.6.40-sec1'
          sapi/cli/php -i | grep -F max_multipart_body_parts
          # Note: OOM exit status alone does NOT prove a CVE has been fixed.
          bash /work/tests/run-parallel.sh 2 Zend/tests ext/session/tests tests/basic
          mkdir -p "/work/dist/php-5.6.40-sec1-${DISTRO}/bin" \
                   "/work/dist/php-5.6.40-sec1-${DISTRO}/sbin"
          cp sapi/cli/php "/work/dist/php-5.6.40-sec1-${DISTRO}/bin/php"
          cp sapi/cgi/php-cgi "/work/dist/php-5.6.40-sec1-${DISTRO}/bin/php-cgi"
          cp sapi/fpm/php-fpm "/work/dist/php-5.6.40-sec1-${DISTRO}/sbin/php-fpm"
          cd /work/dist
          tar czf "php-5.6.40-sec1-${DISTRO}.tar.gz" "php-5.6.40-sec1-${DISTRO}"
          IN_CONTAINER

      - name: Upload test logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php56-${{ matrix.name }}-test-logs
          if-no-files-found: ignore
          path: php-5.6.40/ci-test-logs/

      - name: Upload binaries (only after successful build and tests)
        uses: actions/upload-artifact@v4
        with:
          name: php-5.6.40-sec1-${{ matrix.name }}
          if-no-files-found: error
          path: dist/php-5.6.40-sec1-${{ matrix.name }}.tar.gz
