name: apply-security-patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: php56-security-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    env:
      TARGET_BRANCH: PHP-5.6-CVE-2026-109618-109619
      PATCH_FILE: security-backports/php-5.6.40-CVE-2026-109618-109619.patch
    steps:
      - name: Check out the target PHP 5.6 branch
        uses: actions/checkout@v4
        with:
          ref: PHP-5.6-CVE-2026-109618-109619
          fetch-depth: 1
          persist-credentials: true

      - name: Check prerequisites and working tree
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PATCH_FILE"
          test -f Zend/zend_alloc.c
          test -f main/php_version.h
          git diff --exit-code
          git diff --cached --exit-code
          grep -q '#define PHP_VERSION "5.6.40"' main/php_version.h ||             grep -q '#define PHP_VERSION "5.6.40-sec1"' main/php_version.h

      - name: Apply complete patch or recognize an already-applied patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if git apply --reverse --check "$PATCH_FILE"; then
            echo 'Full patch already applied; no changes required.'
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          else
            git apply --check "$PATCH_FILE"
            git apply "$PATCH_FILE"
            git diff --check
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push patch
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 0; }
          git commit -m 'Backport PHP 5.6 CVE-2026-109618/109619 changes'
          git push origin "HEAD:${TARGET_BRANCH}"
