name: build-multi-windows-php56-candidates

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [PHP-5.6-CVE-2026-109618-109619]
    paths:
      - .github/workflows/build-multi-windows-php56.yml
      - 'ci/windows/**'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PHP56_TOOLS_ROOT: C:\php56-vc11
      PHP56_WORK_ROOT: C:\php56-work
    steps:
      - name: Keep checkout line endings deterministic for strict patch checks
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure Git line endings' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: source
        name: Verify source and automation scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -ne 'PHP-5.6-CVE-2026-109618-109619') { throw 'Select patched PHP 5.6 branch' }
          python ci/prepare-git-patch.py --source security-backports/php-5.6.40-CVE-2026-109618-109619.patch --output "$env:RUNNER_TEMP/php56-git.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Patch preparation failed' }
          git apply --reverse --check "$env:RUNNER_TEMP/php56-git.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Security patch is incomplete' }
          python ci/windows/test_validation.py
          if ($LASTEXITCODE -ne 0) { throw 'Python validation tests failed' }
          ./ci/windows/test-scripts.ps1
      - id: setup
        name: Automatically install and verify VC11 and both PHP SDK dependency sets
        shell: pwsh
        run: ./ci/windows/setup-vc11.ps1 -ToolsRoot $env:PHP56_TOOLS_ROOT
      - id: x86_nts
        name: Build and verify x86 NTS
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: ./ci/windows/build-one.ps1 -Arch x86 -Threading nts -ToolsRoot $env:PHP56_TOOLS_ROOT -WorkRoot $env:PHP56_WORK_ROOT
      - id: x86_ts
        name: Build and verify x86 TS
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: ./ci/windows/build-one.ps1 -Arch x86 -Threading ts -ToolsRoot $env:PHP56_TOOLS_ROOT -WorkRoot $env:PHP56_WORK_ROOT
      - id: x64_nts
        name: Build and verify x64 NTS
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: ./ci/windows/build-one.ps1 -Arch x64 -Threading nts -ToolsRoot $env:PHP56_TOOLS_ROOT -WorkRoot $env:PHP56_WORK_ROOT
      - id: x64_ts
        name: Build and verify x64 TS
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: ./ci/windows/build-one.ps1 -Arch x64 -Threading ts -ToolsRoot $env:PHP56_TOOLS_ROOT -WorkRoot $env:PHP56_WORK_ROOT
      - name: Upload x86 NTS binaries
        if: ${{ !cancelled() && steps.x86_nts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: php56-windows-vc11-x86-nts-core-candidate
          path: artifacts/windows/x86-nts/binaries/
          if-no-files-found: error
      - name: Upload x86 TS binaries
        if: ${{ !cancelled() && steps.x86_ts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: php56-windows-vc11-x86-ts-core-candidate
          path: artifacts/windows/x86-ts/binaries/
          if-no-files-found: error
      - name: Upload x64 NTS binaries
        if: ${{ !cancelled() && steps.x64_nts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: php56-windows-vc11-x64-nts-core-candidate
          path: artifacts/windows/x64-nts/binaries/
          if-no-files-found: error
      - name: Upload x64 TS binaries
        if: ${{ !cancelled() && steps.x64_ts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: php56-windows-vc11-x64-ts-core-candidate
          path: artifacts/windows/x64-ts/binaries/
          if-no-files-found: error
      - name: Write actual build summary
        if: always()
        shell: pwsh
        run: |
          python ci/windows/summarize.py artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Could not summarize build results' }
      # Keep each artifact on one Windows drive. The build workspace is on D:
      # and the toolchain is on C:, so they have no shared filesystem root.
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php56-windows-build-evidence
          path: artifacts/windows/**/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php56-windows-toolchain-evidence
          path: |
            C:/php56-vc11/logs/
            C:/php56-vc11/toolchain.json
          if-no-files-found: warn
          retention-days: 14
